<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace client · Charabia</title>
<meta name="description" content="Prototype de l'espace client Charabia : bureau 3D et vue classique. Données fictives.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#26272B; --text:#4A4E57; --muted:#5F6470;
  --line:#E1E3E8; --line2:#D9DCE2; --blue:#3B5BFF; --blue-ink:#2D47E0; --blue-soft:#EEF1FF; --blue-light:#9DB0FF;
  --off:#B9BEC8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(rgba(38,39,43,.08) 1.4px,transparent 1.6px) 0 0/28px 28px;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue-ink)}a:hover{color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tight{font-family:'Inter Tight',sans-serif;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-ink)}
.eyebrow{display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--blue)}

/* En-tête */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top-in{max-width:1560px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:16px}
.logo{display:inline-flex;flex-direction:column}
.logo span{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.04em;color:var(--ink);line-height:1}
.logo svg{width:100%;height:7px;margin-top:3px}
.pill-tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-ink);padding:6px 10px;border-radius:999px;background:var(--blue-soft)}
.right{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.switch-view{display:flex;gap:4px;padding:4px;border-radius:999px;background:#E9EBEF}
.switch-view button{border:0;background:transparent;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;color:var(--ink)}
.switch-view button[aria-pressed="true"]{background:var(--ink);color:#fff}
.who{display:flex;flex-direction:column;align-items:flex-end}
.who b{font-size:15px;color:var(--ink)}.who span{font-size:13px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700}
.demo-note{max-width:1560px;margin:0 auto;padding:10px 24px 0;font-size:13px;color:var(--muted)}

/* Cartes et éléments communs */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.card h2{margin:0;font-size:22px}
.dark{background:var(--ink);border:0;color:#D5D8DF}
.dark h2{color:#fff}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px}
.btn.ghost{background:#fff;border-color:var(--line2);color:var(--ink)}
.done-tag{font-size:14px;font-weight:600;color:var(--ink);padding:10px 14px;border-radius:999px;background:var(--bg);white-space:nowrap}
.toggle{flex:none;width:64px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.toggle .track{width:52px;height:30px;padding:3px;border-radius:999px;background:var(--off);display:flex;justify-content:flex-start;transition:background .2s}
.toggle .knob{width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(38,39,43,.25)}
.toggle[aria-checked="true"] .track{background:var(--blue);justify-content:flex-end}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-size:15px;font-weight:600;color:var(--ink)}
.row .d{font-size:13px;color:var(--muted);line-height:1.4}

/* ===== Vue bureau 3D ===== */
.office{max-width:1560px;margin:0 auto;padding:20px 24px 32px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.scene-card{flex:999 1 640px;min-width:0;position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;height:min(860px,calc(100vh - 140px));min-height:520px}
.scene-head{position:absolute;left:24px;top:20px;z-index:2;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.scene-head p{margin:0;font-size:15px;color:var(--muted)}
.legend{position:absolute;left:24px;bottom:18px;z-index:2;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.stage{position:absolute;left:50%;top:57%;width:0;height:0}
.room{position:absolute;left:-410px;top:-310px;width:820px;height:620px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(45deg)}
.room *{transform-style:preserve-3d}
.abs{position:absolute}
.side-panel{flex:1 1 380px;max-width:460px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.side-panel{max-width:none}}
.labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.bubble{position:absolute;left:0;top:0;visibility:hidden;pointer-events:auto;width:150px;min-height:56px;transform:translate(-50%,-100%);padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 10px 24px rgba(38,39,43,.14);display:flex;flex-direction:column;align-items:center;gap:2px}
.bubble b{font-family:'Inter Tight',sans-serif;font-size:15px;letter-spacing:-.02em}
.bubble small{font-size:12px;font-weight:600;color:var(--muted)}
.bubble.on small{color:var(--blue-ink)}
.bubble.free{background:var(--bg);border-style:dashed;border-color:#8A8F9A}
.bubble.sel{background:var(--blue);border:1px solid var(--blue);color:#fff}
.bubble.sel small{color:#E3E8FF}
.billboard{transform-origin:50% 100%}
@keyframes cbType{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes cbZ{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
@keyframes cbSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.typing{animation:cbType 1.2s ease-in-out infinite}
.zz{position:absolute;right:-4px;top:-6px;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:20px;color:var(--muted);animation:cbZ 2.4s ease-in-out infinite}
.sway{transform-origin:50% 100%;animation:cbSway 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.typing,.zz,.sway{animation:none}}
.price-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.notice{margin:0;font-size:14px;line-height:1.45;color:var(--ink);padding:12px 14px;border-radius:14px;background:var(--blue-soft)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.badge{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--blue-soft);font-size:13px;font-weight:600;color:var(--ink)}
.badge.no{background:var(--bg);opacity:.7}

/* ===== Vue classique ===== */
.classic{max-width:1280px;margin:0 auto;padding:32px 24px 56px;display:flex;flex-direction:column;gap:28px}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hello h1{margin:10px 0 0;font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-.045em}
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.kpi{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{font-family:'Inter Tight',sans-serif;font-size:40px;letter-spacing:-.04em;color:var(--ink);line-height:1}
.kpi small{font-size:13px;color:var(--muted)}
.kpi.hot{background:var(--blue);border-color:var(--blue);box-shadow:0 16px 40px rgba(59,91,255,.28)}
.kpi.hot span,.kpi.hot small{color:#E3E8FF}.kpi.hot b{color:#fff}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.col-side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px}
.kind{flex:none;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);padding:6px 10px;border-radius:8px;background:var(--blue-soft);min-width:76px;text-align:center}
.hist{display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
.hist span:first-child{flex:none;width:96px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)}
.wrap-row{flex-wrap:wrap}
@media (max-width:700px){
  .top{position:static}
  .top-in,.office,.classic{padding-left:16px;padding-right:16px}
  .demo-note{padding-left:16px;padding-right:16px}
  .count-tag{display:none}
  .scene-card{height:auto;aspect-ratio:1/1.05;min-height:340px}
  .scene-head p,.legend{display:none}
  .stage{top:54%}
  .bubble{width:auto;min-height:0;padding:4px 8px;border-radius:10px}
  .bubble b{font-size:11px;white-space:nowrap}
  .bubble small{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------- Données fictives ----------
  var AGENTS = [
    { id: "agenda", who: "Camille", name: "Réservation & agenda", short: "Agenda", owned: false, x: 100, y: 130, price: "400 € + 19 €/mois", desc: "Prend les rendez-vous en ligne, les ajoute à votre agenda et envoie un rappel la veille.", plant: true },
    { id: "site", who: "Léa", name: "Assistant du site", short: "Site", owned: false, x: 270, y: 130, price: "800 € + 49 €/mois", desc: "Répond 24h/24 aux questions de vos visiteurs, en FR, NL, DE et EN, et vous passe la main." },
    { id: "visi", who: "Inès", name: "Visibilité", short: "Visibilité", owned: false, x: 440, y: 130, price: "400 € + 99 €/mois", desc: "Prépare vos publications Instagram, Facebook et Google, un article et une newsletter par mois.", plant: true },
    { id: "pilot", who: "Thomas", name: "Pilotage", short: "Pilotage", owned: false, x: 610, y: 130, price: "400 € + 29 €/mois", desc: "Tableau de bord et rapport hebdomadaire : demandes, devis signés, provenance des clients." },
    { id: "devis", who: "Hugo", name: "Devis intelligent", short: "Devis", owned: true, x: 100, y: 330, desc: "Transforme chaque demande en fiche claire avec une estimation selon vos tarifs.", stat: "12 demandes traitées", ids: ["p1"], skin: "#C98E6B", hair: "#2B211C", long: false, shirt: "#3B5BFF", mug: "#3B5BFF" },
    { id: "mail", who: "Noah", name: "Assistant mail", short: "Mails", owned: true, x: 270, y: 330, desc: "Trie vos mails, résume la journée et prépare les réponses simples.", stat: "31 mails triés, 9 brouillons", ids: ["p2"], skin: "#F1C7A5", hair: "#C98B3B", long: false, shirt: "#26272B", mug: "#F07A52", plant: true },
    { id: "admin", who: "Sofia", name: "Admin & relances", short: "Relances", owned: true, x: 440, y: 330, desc: "Relance les devis sans réponse et les impayés, classe vos factures pour le comptable.", stat: "3 relances envoyées", ids: ["p3"], skin: "#8D5B3E", hair: "#1E1A18", long: true, shirt: "#7FB78A", mug: "#26272B" },
    { id: "avis", who: "Maxime", name: "Avis & fidélisation", short: "Avis", owned: true, x: 610, y: 330, desc: "Demande un avis Google après chaque chantier et prépare vos réponses.", stat: "aucune demande envoyée", ids: [], skin: "#F3D2B3", hair: "#5A3A28", long: false, shirt: "#9DB0FF", mug: "#7FB78A" }
  ];
  var ITEMS = {
    p1: { kind: "Devis", agent: "devis", title: "Salle de bain · Mme Lambert", detail: "Douche à l’italienne · estimation 2 480 € HTVA", when: "Reçu aujourd’hui à 9 h 12" },
    p2: { kind: "Réponse", agent: "mail", title: "M. Renard demande un créneau", detail: "Proposition préparée : jeudi 14 h ou vendredi 9 h", when: "Reçu hier à 18 h 05" },
    p3: { kind: "Relance", agent: "admin", title: "Facture 2026-041 · Café du Centre", detail: "30 jours de retard · 640 € HTVA · relance polie prête", when: "À envoyer aujourd’hui" }
  };
  var HISTORY = [
    ["Auj. 9:12", "Hugo a reçu une demande de devis (Mme Lambert) : fiche créée et estimation préparée."],
    ["Auj. 7:00", "Noah a envoyé le résumé du matin sur WhatsApp : 2 demandes, 1 relance, 4 mails à lire."],
    ["Hier 18:05", "Noah a préparé une réponse avec deux créneaux pour M. Renard."],
    ["Hier 11:30", "Devis 2026-118 accepté par M. et Mme Collard : rendez-vous ajouté à l’agenda."],
    ["Lun. 8:00", "Sofia a relancé la facture 2026-037 : payée le jour même."]
  ];

  var state = {
    view: location.hash === "#classique" ? "classique" : "bureau",
    sel: "devis",
    on: { devis: true, mail: true, admin: true, avis: false },
    done: {},
    requested: {},
    conges: false
  };

  function agent(id) { for (var i = 0; i < AGENTS.length; i++) if (AGENTS[i].id === id) return AGENTS[i]; return AGENTS[4]; }
  function px(n) { return n + "px"; }
  function todoCount() { return ["p1", "p2", "p3"].filter(function (i) { return !state.done[i]; }).length; }
  function todoText() { var t = todoCount(); return t === 0 ? "Tout est validé" : t + (t > 1 ? " éléments à valider" : " élément à valider"); }

  // ---------- En-tête commun ----------
  function header() {
    var team = AGENTS.filter(function (a) { return a.owned; });
    var active = team.filter(function (a) { return state.on[a.id]; }).length;
    return '<header class="top"><div class="top-in">' +
      '<div class="brand"><div class="logo"><span>Charabia</span>' +
      '<svg viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true"><path d="M1 4 q3.5 -3.5 7 0 t7 0 t7 0 t7 0 C33 4 36 4 40 4 L99 4" stroke="#3B5BFF" stroke-width="2.6" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>' +
      '<span class="pill-tag">Espace client</span></div>' +
      '<div class="right">' +
      '<div class="switch-view" role="group" aria-label="Affichage">' +
      '<button type="button" data-action="view" data-view="bureau" aria-pressed="' + (state.view === "bureau") + '">Bureau 3D</button>' +
      '<button type="button" data-action="view" data-view="classique" aria-pressed="' + (state.view === "classique") + '">Vue classique</button>' +
      '</div>' +
      '<span class="pill-tag count-tag">' + team.length + ' employés sur 8 · ' + active + ' au travail</span>' +
      '<div class="who"><b>Plomberie Dubois</b><span>Pack Artisan</span></div>' +
      '<span class="avatar" aria-hidden="true">MD</span>' +
      '</div></div></header>' +
      '<p class="demo-note">Prototype · Plomberie Dubois est un client fictif, toutes les données sont des exemples.</p>';
  }

  function toggle(id, label, checked) {
    return '<button type="button" class="toggle" role="switch" aria-checked="' + checked + '" aria-label="' + label + '" data-action="toggle" data-id="' + id + '"><span class="track"><span class="knob"></span></span></button>';
  }

  // ---------- Vue bureau 3D ----------
  function box(x, y, w, d, h, z, top, front, side, r) {
    return '<div class="abs" style="left:' + px(x) + ';top:' + px(y) + ';width:' + px(w) + ';height:' + px(d) + ';transform:translateZ(' + px(z || 0) + ')">' +
      '<div class="abs" style="left:0;top:' + px(d) + ';width:' + px(w) + ';height:' + px(h) + ';transform-origin:50% 0;transform:rotateX(90deg);background:' + front + '"></div>' +
      '<div class="abs" style="left:' + px(w) + ';top:0;width:' + px(h) + ';height:' + px(d) + ';transform-origin:0 50%;transform:rotateY(-90deg);background:' + side + '"></div>' +
      '<div class="abs" style="left:0;top:0;width:' + px(w) + ';height:' + px(d) + ';border-radius:' + px(r || 0) + ';transform:translateZ(' + px(h) + ');background:' + top + '"></div>' +
      '</div>';
  }

  function plantSvg(pot, rim) {
    return '<svg class="sway" viewBox="0 0 120 160" width="100%" height="100%" aria-hidden="true" style="display:block;overflow:visible">' +
      '<g transform="rotate(-38 60 116)"><ellipse cx="60" cy="70" rx="11" ry="40" fill="#4C8A5C"/></g>' +
      '<g transform="rotate(38 60 116)"><ellipse cx="60" cy="70" rx="11" ry="40" fill="#4C8A5C"/></g>' +
      '<g transform="rotate(-62 60 116)"><ellipse cx="60" cy="78" rx="10" ry="34" fill="#6FAE7D"/></g>' +
      '<g transform="rotate(62 60 116)"><ellipse cx="60" cy="78" rx="10" ry="34" fill="#6FAE7D"/></g>' +
      '<g transform="rotate(-16 60 116)"><ellipse cx="60" cy="62" rx="12" ry="46" fill="#5E9E6E"/></g>' +
      '<g transform="rotate(16 60 116)"><ellipse cx="60" cy="64" rx="11" ry="44" fill="#7FB78A"/></g>' +
      '<path d="M36 114 H84 L78 158 H42 Z" fill="' + pot + '"/><rect x="32" y="108" width="56" height="12" rx="4" fill="' + rim + '"/></svg>';
  }

  function plant(fx, fy, size, pot, rim) {
    var w = Math.round(120 * size), h = Math.round(160 * size);
    return '<div class="abs billboard" style="left:' + px(fx - w / 2) + ';top:' + px(fy - h) + ';width:' + px(w) + ';height:' + px(h) + ';transform:rotateZ(-45deg) rotateX(-58deg)">' + plantSvg(pot, rim) + '</div>';
  }

  function personSvg(a, on) {
    return '<svg class="' + (on ? "typing" : "") + '" viewBox="0 0 100 140" width="100" height="140" role="img" aria-label="' + a.who + (on ? ", au travail" : ", endormi : poste en pause") + '" style="display:block;overflow:visible">' +
      '<rect x="20" y="60" width="60" height="78" rx="14" fill="#5F6470"/>' +
      (a.long ? '<rect x="29" y="24" width="42" height="52" rx="20" fill="' + a.hair + '"/>' : "") +
      '<path d="M24 138 V98 a26 26 0 0 1 52 0 V138 Z" fill="' + a.shirt + '"/>' +
      '<rect x="44" y="62" width="12" height="14" rx="4" fill="' + a.skin + '"/>' +
      '<rect x="37" y="106" width="26" height="9" rx="4.5" fill="#FFFFFF" opacity="0.9"/>' +
      '<g transform="' + (on ? "rotate(0 50 62)" : "rotate(16 50 62)") + '">' +
      '<circle cx="50" cy="46" r="19" fill="' + a.skin + '"/>' +
      '<path d="M31 47 C30 31 40 25 50 25 C61 25 70 31 69 47 C65 39 57 36 50 36 C43 36 35 39 31 47 Z" fill="' + a.hair + '"/>' +
      (on
        ? '<circle cx="43" cy="48" r="2.4" fill="#26272B"/><circle cx="57" cy="48" r="2.4" fill="#26272B"/><path d="M44 55 q6 5 12 0" stroke="#26272B" stroke-width="2" fill="none" stroke-linecap="round"/>'
        : '<path d="M40 49 q3 2.5 6 0 M54 49 q3 2.5 6 0" stroke="#26272B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M47 56 h6" stroke="#26272B" stroke-width="2" stroke-linecap="round"/>') +
      '</g></svg>' + (on ? "" : '<span class="zz" aria-hidden="true">z z</span>');
  }

  var chairSvg = '<svg viewBox="0 0 100 140" width="100" height="140" aria-hidden="true" style="display:block">' +
    '<rect x="24" y="44" width="52" height="58" rx="16" fill="#9AA0AC"/><rect x="30" y="50" width="40" height="44" rx="12" fill="#B9BEC8"/>' +
    '<rect x="18" y="98" width="64" height="14" rx="7" fill="#7C828E"/><rect x="47" y="112" width="6" height="14" fill="#5F6470"/>' +
    '<path d="M26 134 L50 125 L74 134" stroke="#5F6470" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var smallPlant = '<svg viewBox="0 0 120 160" width="100%" height="100%" aria-hidden="true" style="display:block;overflow:visible">' +
    '<g transform="rotate(-30 60 116)"><ellipse cx="60" cy="74" rx="14" ry="38" fill="#5E9E6E"/></g>' +
    '<g transform="rotate(30 60 116)"><ellipse cx="60" cy="74" rx="14" ry="38" fill="#7FB78A"/></g>' +
    '<ellipse cx="60" cy="66" rx="14" ry="44" fill="#4C8A5C"/><path d="M34 112 H86 L80 158 H40 Z" fill="#FFFFFF" stroke="#D9DCE2" stroke-width="4"/></svg>';

  function station(a) {
    var on = a.owned && !!state.on[a.id];

  function fitScene() {
    var scene = document.getElementById("scene"), stage = document.getElementById("stage");

    var s = Math.min(1, (scene.clientWidth - 40) / 1060, (scene.clientHeight - 60) / 820);

  // Les étiquettes restent en 2D (texte net) et suivent un point d'ancrage placé dans la scène 3D.
  function placeLabels() {
    var scene = document.getElementById("scene");
    if (!scene) return;
    var cr = scene.getBoundingClientRect();
    var anchors = scene.querySelectorAll("[data-anchor]");
    for (var i = 0; i < anchors.length; i++) {
      var r = anchors[i].getBoundingClientRect();
      var b = scene.querySelector('.bubble[data-id="' + anchors[i].getAttribute("data-anchor") + '"]');
      if (!b) continue;
      b.style.left = Math.round(r.left - cr.left) + "px";
      b.style.top = Math.round(r.top - cr.top) + "px";
      b.style.visibility = "visible";
    }
  }

    if (!el) return;
    var act = el.getAttribute("data-action"), id = el.getAttribute("data-id");
    if (el.tagName === "A") e.preventDefault();
    if (act === "view") {
      state.view = el.getAttribute("data-view");
      history.replaceState(null, "", state.view === "classique" ? "#classique" : "#bureau");
      window.scrollTo(0, 0);
    } else if (act === "select") state.sel = id;
    else if (act === "toggle") { if (id === "conges") state.conges = !state.conges; else state.on[id] = !state.on[id]; }
    else if (act === "validate") state.done[id] = "ok";
    else if (act === "edit") state.done[id] = "edit";
    else if (act === "request") state.requested[id] = true;
    else return;
    var focusKey = act + ":" + (id || el.getAttribute("data-view") || "");
    render();
    var again = app.querySelector('[data-action="' + act + '"]' + (id ? '[data-id="' + id + '"]' : (el.getAttribute("data-view") ? '[data-view="' + el.getAttribute("data-view") + '"]' : "")));
    if (again && focusKey) again.focus({ preventScroll: true });
  });

  window.addEventListener("resize", fitScene);
  window.addEventListener("hashchange", function () {
    var v = location.hash === "#classique" ? "classique" : "bureau";
    if (v !== state.view) { state.view = v; render(); }
  });
  render();
})();
</script>
</body>
</html>
